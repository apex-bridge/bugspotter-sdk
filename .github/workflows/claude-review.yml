name: Claude PR Review

# Auto-reviews every PR using the Claude GitHub App, plus responds to
# `@claude` mentions in PR comments. Mirrors the workflow used in
# bugspotter-public and bugspotter-common.
#
# Setup prerequisite: the repo must have either `ANTHROPIC_API_KEY`
# or `CLAUDE_CODE_OAUTH_TOKEN` configured as an Actions secret.
# Without one of those, the action runs but exits silently — the
# review check simply doesn't post anything visible.

on:
  # Auto-review the PR ONCE on open / ready-for-review / reopen.
  # `synchronize` (per-push) is intentionally excluded — reviewing
  # a fresh revision on every commit pushed to an open PR dominates
  # action spend without producing more useful signal. If a PR moves
  # significantly, the requester can re-run via `@claude review` and
  # that path is rate-limited by being human-driven.
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  # @claude mentions in PR comments and review threads. The `if:`
  # guard below keeps the workflow from running on issue-comments
  # outside of PRs and on comments that don't address Claude.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Cancel in-flight reviews when new COMMITS are pushed (so we don't
# review a stale revision) — but NOT when comment events fire.
# Comment events queue / run alongside; the job-level `if:` filters
# out anything without `@claude`.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude-review:
    name: Claude Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Shallow clone — review only needs the diff, not full history.
          fetch-depth: 1

      # Comment-triggered workflows run against the default branch,
      # not the PR's HEAD — that's how GitHub dispatches them. Without
      # this step, Claude is staring at `main` and has to discover the
      # PR's contents via repeated `gh pr diff` / `gh api` calls,
      # burning max-turns before it can post anything.
      - name: Checkout PR branch when triggered by comment
        if: |
          github.event_name == 'issue_comment' ||
          github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          gh pr checkout "$PR_NUMBER"

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Pass both auth modes — the action picks whichever secret
          # is set. ANTHROPIC_API_KEY is raw API billing;
          # CLAUDE_CODE_OAUTH_TOKEN is what `/install-github-app`
          # populates and uses App billing.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number || github.event.issue.number }}. Focus on real-impact issues:
            - Auth/security: bypass, injection, missing tenant scoping, credential leak, SSRF
            - Concurrency: races, deadlocks, transactional gaps
            - Missing tests for new behavior
            - Concrete bugs at file:line — name the failure mode

            Skip nits, style, theoretical issues.

            ${{ github.event_name == 'pull_request' && 'Output rules: inline comments only — no top-level summary. If nothing substantive, exit silently (this is an automatic per-push review; silence is the right default).' || 'Output rules: this review was triggered explicitly by a human via @claude — they need to know the action ran and what you concluded. Post inline comments for any real-impact issues you find, then ALWAYS post exactly ONE short top-level comment via `gh pr comment` summarising the outcome (e.g. "Reviewed N files; no real-impact issues found." or "Posted N inline comments — see threads above."). Never exit silently on a human-triggered review.' }}

            Process: read the full diff in one `gh pr diff` call. Use `Grep`
            across the working tree only when a comment would otherwise be
            inaccurate without the surrounding context. Don't enumerate every
            file; pick the riskiest spots. Post inline comments on at most
            5 issues, then stop.
          # Allowlist notes:
          # - `mcp__github_inline_comment__create_inline_comment` is
          #   the MCP-bridged tool the action uses to buffer inline
          #   review comments. Without it allow-listed, Claude's tool
          #   calls get denied and the action silently produces nothing.
          # - `gh pr diff` and `gh pr view` are read-only fallbacks
          #   for exploratory navigation.
          # - `Read`, `Grep`, `Glob` are the built-in file-navigation
          #   tools (also read-only).
          # - `gh pr comment` is conditionally allow-listed ONLY for
          #   comment-triggered (`@claude`) runs. Per-push auto-runs
          #   remain inline-only — silent-exit is the right default.
          # - We deliberately do NOT allow `gh api:*` (it supports
          #   `-X POST/PATCH/DELETE` so the wildcard would let Claude
          #   mutate any GitHub resource the workflow token can touch).
          #
          # GitHub Actions empty-string-is-falsy gotcha: the
          # `cond && truthy || fallback` ternary only works when the
          # truthy branch is non-empty. Both branches of the model
          # selection below are non-empty model ids so it's safe;
          # the allowedTools line uses the form `cond && extra || ''`
          # which DOES work because we're appending.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob${{ github.event_name != 'pull_request' && ',Bash(gh pr comment:*)' || '' }}"
            --max-turns 25
            --model ${{ github.event_name == 'pull_request' && 'claude-haiku-4-5-20251001' || 'claude-opus-4-7' }}
